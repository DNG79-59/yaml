rule-providers:
  个人直连:
    behavior: domain
    format: text
    interval: 86400
    type: http
    path: ./ruleset/personnelDirect.yaml
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/personnelDirect.txt
  个人代理:
    behavior: domain
    format: text
    interval: 86400
    type: http
    path: ./ruleset/personnelProxy.txt
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/personnelProxy.txt
  emby:
    behavior: domain
    format: text
    interval: 86400
    type: http
    path: ./ruleset/emby.txt
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/emby.txt

  Steam@cn:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/SteamCN.list
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
    interval: 86400

  apple-cn:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/apple-cn.yaml
    url: https://fastly.jsdelivr.net/gh/xndeye/rule-merger@release/apple@cn.yaml
    interval: 86400
  
  private:
    type: http
    format: yaml
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  privatecidr:
