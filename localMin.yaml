mode: rule
log-level: warning
ipv6: false
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc
  
  # 监听本地端口
  listen: 0.0.0.0:53

  # 自举 DNS：纯 IP，不依赖任何上游，DNS 环的终点（缺这段 Stash 会报环路）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认使用的 Nameserver（必须是能够直接建立 TCP/TLS 连接的 IP 或加密 DoH 链接）
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


