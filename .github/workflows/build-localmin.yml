name: Build localMin

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - localMin.yaml
      - providers-by-one.yaml
      - providers-by-two.yaml
      - tools/build_localmin.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python tools/build_localmin.py
      - name: Commit generated config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add localMin.generated.yaml
          git diff --cached --quiet || git commit -m "chore: update generated localMin"
          git push
