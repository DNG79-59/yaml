    interval: 300
  - name: emby-Auto
    type: url-test
    include-all: true
    filter: ^(?!.*(5×|美国|日本)).*$
    url: https://emby1.69yun69.com
    interval: 300
    hidden: false
    tolerance: 100
    timeout: 2
  - name: emby-LoadBalance
    type: load-balance
    include-all: true
    strategy: consistent-hashing # 使用一致性哈希确保连接稳定性
    url: https://emby1.69yun69.com
    interval: 300
    hidden: true
    filter: ^(?!.*(5×|美国|日本)).*$
