  - name: GLOBAL
    type: select
    proxies:
      - Proxy
      - leaf
      
  - name: HK-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)港|🇭🇰|HK|(?i)Hong
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
    proxies:
      - leaf
  - name: SG-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
    proxies:
      - leaf
  - name: US-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)美|🇺🇲|US|(?i)States|American
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
    proxies:
      - leaf

  - name: HK-FallBack
    type: fallback
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)港|🇭🇰|HK|(?i)Hong
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
  - name: SG-FallBack
    type: fallback
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
  - name: US-FallBack
