    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)美|🇺🇲|US|(?i)States|American
    interval: 300
    url: 'http://www.gstatic.com/generate_204' # 检查用 URL
  - name: HK-LoadBalance
    type: load-balance
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)港|🇭🇰|HK|(?i)Hong
    strategy: consistent-hashing
    interval: 300
  - name: SG-LoadBalance
    type: load-balance
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore
    strategy: consistent-hashing
    interval: 300
  - name: US-LoadBalance
    type: load-balance
    hidden: true
    include-all: true
    filter: ^(?!.*emby).*(?i)美|🇺🇲|US|(?i)States|American
    strategy: consistent-hashing
    interval: 300
