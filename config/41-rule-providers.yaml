# 规则订阅单独存放，只含 rule-providers:
# 来源：all-rules.yaml:35-84
rule-providers:
  private:
    type: http
    format: yaml
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  telegramcidr:
    type: http
    format: yaml
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  privatecidr:
    type: http
    format: yaml
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/clash/ipcidr/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  个人直连:
    behavior: domain
    format: text
    interval: 86400
    type: http
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/personnelDirect.txt
  个人代理:
    behavior: domain
    format: text
    interval: 86400
    type: http
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/personnelProxy.txt
  emby:
    behavior: domain
    format: text
    interval: 86400
    type: http
    url: https://raw.githubusercontent.com/DNG79-59/yaml/refs/heads/main/emby.txt

  Steam@cn:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
    interval: 86400
